<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Doubts 🎉</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📝 My Doubts 📝</h2>
            <button id="clearAllBtn" class="clear-btn">Clear All</button>
        </div>
        
        <div id="doubtsList" class="doubts-list">
            <!-- doubts show here -->
            <div class="empty-state">
                <p>✨ No doubts yet!</p>
                <p>Watch a YouTube video and click the "Mark doubt 🤔" button to store more doubts</p>
            </div>
        </div>
        
        <div class="footer">
            <p>Click any timestamp to jump to that moment</p>
        </div>
    </div>
    
    <script src="dashboard.js"></script>
</body>
</html>
